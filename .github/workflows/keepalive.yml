name: Keep scheduled workflows active

on:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: keep-scheduled-workflows-active
  cancel-in-progress: false

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Check out workflow branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Create a 52-day keepalive commit
        shell: bash
        run: |
          set -euo pipefail

          readonly time_elapsed_days=52
          readonly last_commit_epoch="$(git log -1 --format=%ct)"
          readonly current_epoch="$(date -u +%s)"
          readonly elapsed_days=$(( (current_epoch - last_commit_epoch) / 86400 ))

          if (( elapsed_days < time_elapsed_days )); then
            echo "Latest commit is ${elapsed_days} day(s) old; no keepalive commit is due."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore: keep scheduled workflows active"
          git push origin HEAD:main
