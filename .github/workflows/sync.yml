name: Publish gh executables without copilot

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-no-copilot
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out workflow branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check upstream release publication state
        id: upstream
        shell: bash
        run: |
          set -euo pipefail

          tag_name="$(gh api repos/cli/cli/releases/latest --jq .tag_name)"
          test -n "$tag_name"
          git fetch --force --no-tags https://github.com/cli/cli.git "refs/tags/${tag_name}:refs/tags/upstream/${tag_name}"

          release_missing=true
          if gh release view "$tag_name" >/dev/null 2>&1; then
            release_missing=false
          fi

          echo "release_missing=${release_missing}" >> "$GITHUB_OUTPUT"
          echo "tag_name=${tag_name}" >> "$GITHUB_OUTPUT"
          echo "upstream_commit=$(git rev-parse "refs/tags/upstream/${tag_name}^{}")" >> "$GITHUB_OUTPUT"

      - name: Prepare no-copilot source
        if: steps.upstream.outputs.release_missing == 'true'
        shell: bash
        run: |
          set -euo pipefail

          git switch --detach "${{ steps.upstream.outputs.upstream_commit }}"
          sed -i '/copilotCmd "github.com\/cli\/cli\/v2\/pkg\/cmd\/copilot"/d' pkg/cmd/root/root.go
          sed -i '/cmd.AddCommand(copilotCmd.NewCmdCopilot(f, telemetry, nil))/d' pkg/cmd/root/root.go
          rm -rf pkg/cmd/copilot
          gofmt -w pkg/cmd/root/root.go

          if grep -q 'copilotCmd\|pkg/cmd/copilot' pkg/cmd/root/root.go; then
            echo "copilot command registration was not completely removed." >&2
            exit 1
          fi

      - name: Set up Go
        if: steps.upstream.outputs.release_missing == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build platform executables
        if: steps.upstream.outputs.release_missing == 'true'
        env:
          TAG_NAME: ${{ steps.upstream.outputs.tag_name }}
        shell: bash
        run: |
          mkdir -p dist
          build_flags="-s -w -X github.com/cli/cli/v2/internal/build.Version=${TAG_NAME} -X github.com/cli/cli/v2/internal/build.Date=$(date -u +%F)"

          build() {
            GOOS="$1" GOARCH="$2" CGO_ENABLED=0 go build -trimpath -ldflags "$build_flags" -o "$3" ./cmd/gh
          }

          build windows amd64 dist/gh_windows_amd64.exe
          build windows arm64 dist/gh_windows_arm64.exe
          build linux amd64 dist/gh_linux_amd64
          build linux arm64 dist/gh_linux_arm64
          build darwin amd64 dist/gh_macos_amd64
          build darwin arm64 dist/gh_macos_arm64
          test -s dist/gh_windows_amd64.exe
          test -s dist/gh_windows_arm64.exe
          test -s dist/gh_linux_amd64
          test -s dist/gh_linux_arm64
          test -s dist/gh_macos_amd64
          test -s dist/gh_macos_arm64

      - name: Publish unsigned GitHub Release
        if: steps.upstream.outputs.release_missing == 'true'
        env:
          TAG_NAME: ${{ steps.upstream.outputs.tag_name }}
        run: |
          gh release create "$TAG_NAME" dist/gh_* \
            --target main \
            --title "GitHub CLI without copilot ${TAG_NAME}" \
            --notes "Built from cli/cli@${TAG_NAME} with the `copilot` subcommand removed."
